[workspace]
members = [
    "programs/lacuna-pool",
    "programs/lacuna-relay",
    "programs/dummy-amm",
]
resolver = "2"

# cargo-build-sbf ships Cargo 1.79. blake3 1.8+ pulls digest 0.11 / edition 2024.
[workspace.dependencies]
blake3 = "=1.5.5"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
